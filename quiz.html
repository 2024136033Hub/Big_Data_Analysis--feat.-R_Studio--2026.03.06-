<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>앱프로그래밍응용 퀴즈</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f5f5f3; color: #1a1a1a; min-height: 100vh; }
#app { max-width: 700px; margin: 0 auto; padding: 2rem 1rem; }
.screen { display: none; }
.screen.active { display: block; }

.header { margin-bottom: 1.75rem; }
.header h1 { font-size: 22px; font-weight: 600; color: #1a1a1a; margin-bottom: 6px; }
.header p { font-size: 14px; color: #666; }

.progress-bar-wrap { height: 4px; background: #e0e0e0; border-radius: 2px; margin-bottom: 1.75rem; }
.progress-bar-fill { height: 4px; background: #1D9E75; border-radius: 2px; transition: width 0.3s; }

.q-meta { display: flex; gap: 8px; align-items: center; margin-bottom: 0.75rem; flex-wrap: wrap; }
.q-badge { font-size: 11px; padding: 3px 8px; border-radius: 4px; font-weight: 600; }
.q-badge.week { background: #efefef; color: #555; }
.q-badge.type { background: #E1F5EE; color: #0F6E56; }
.q-num { font-size: 13px; color: #999; margin-left: auto; }

.q-text { font-size: 16px; color: #1a1a1a; line-height: 1.65; margin-bottom: 1.25rem; font-weight: 500; white-space: pre-line; }

.options { display: flex; flex-direction: column; gap: 8px; margin-bottom: 1.25rem; }
.option-btn { text-align: left; padding: 12px 14px; border: 1.5px solid #e0e0e0; border-radius: 10px; background: #fff; cursor: pointer; font-size: 14px; color: #1a1a1a; line-height: 1.5; transition: all 0.15s; font-family: inherit; }
.option-btn:hover { background: #f0faf6; border-color: #1D9E75; }
.option-btn.selected { border-color: #1D9E75; background: #E1F5EE; color: #0F6E56; font-weight: 500; }

.text-input-wrap { margin-bottom: 1.25rem; }
.text-input { width: 100%; padding: 12px 14px; border: 1.5px solid #e0e0e0; border-radius: 10px; background: #fff; font-size: 14px; color: #1a1a1a; font-family: inherit; resize: vertical; min-height: 90px; line-height: 1.65; outline: none; transition: border-color 0.15s; }
.text-input:focus { border-color: #1D9E75; }

.table-input-wrap { margin-bottom: 1.25rem; overflow-x: auto; }
table.fill-table { width: 100%; border-collapse: collapse; font-size: 14px; background: #fff; border-radius: 10px; overflow: hidden; border: 1.5px solid #e0e0e0; }
table.fill-table th { background: #f5f5f3; padding: 10px 14px; text-align: left; color: #555; font-weight: 600; border-bottom: 1.5px solid #e0e0e0; }
table.fill-table td { padding: 10px 14px; border-bottom: 1px solid #eee; vertical-align: middle; color: #1a1a1a; }
table.fill-table tr:last-child td { border-bottom: none; }
table.fill-table input { width: 100%; border: none; background: transparent; font-size: 14px; color: #1a1a1a; font-family: inherit; outline: none; }

.multi-hint { font-size: 12px; color: #999; margin-bottom: 8px; }

.btn-row { display: flex; gap: 8px; align-items: center; margin-top: 1rem; }
.btn-primary { padding: 12px 24px; background: #1D9E75; color: #fff; border: none; border-radius: 10px; font-size: 15px; font-weight: 600; cursor: pointer; transition: background 0.15s; font-family: inherit; }
.btn-primary:hover { background: #178a64; }
.btn-secondary { padding: 12px 20px; background: #fff; color: #555; border: 1.5px solid #e0e0e0; border-radius: 10px; font-size: 14px; cursor: pointer; transition: all 0.15s; font-family: inherit; }
.btn-secondary:hover { background: #f5f5f3; }

.score-box { background: #fff; border-radius: 16px; border: 1.5px solid #e0e0e0; padding: 2rem; text-align: center; margin-bottom: 1.75rem; }
.score-num { font-size: 52px; font-weight: 700; color: #1D9E75; line-height: 1; }
.score-label { font-size: 14px; color: #888; margin-top: 8px; }

.result-card { border: 1.5px solid #e0e0e0; border-radius: 12px; padding: 1rem 1.25rem; margin-bottom: 0.75rem; background: #fff; }
.result-card.correct { border-color: #1D9E75; background: #f0faf6; }
.result-card.wrong { border-color: #D85A30; background: #fff5f2; }
.result-card.manual { border-color: #BA7517; background: #fffbf0; }
.result-header { display: flex; align-items: flex-start; gap: 8px; margin-bottom: 8px; }
.result-icon { font-size: 12px; font-weight: 700; padding: 3px 8px; border-radius: 4px; white-space: nowrap; }
.correct .result-icon { background: #1D9E75; color: #fff; }
.wrong .result-icon { background: #D85A30; color: #fff; }
.manual .result-icon { background: #BA7517; color: #fff; }
.result-q { font-size: 13px; color: #444; flex: 1; line-height: 1.5; }
.result-week { font-size: 11px; color: #aaa; white-space: nowrap; }
.result-body { font-size: 13px; color: #1a1a1a; line-height: 1.65; }
.result-answer { margin-top: 8px; padding-top: 8px; border-top: 1px solid #eee; }
.result-answer .correct-ans { color: #0F6E56; font-weight: 600; }
.wrong .result-answer .correct-ans { color: #993C1D; }
.result-explain { margin-top: 8px; font-size: 12px; color: #666; line-height: 1.65; padding: 8px 10px; background: rgba(0,0,0,0.03); border-radius: 6px; }

.filter-row { display: flex; gap: 6px; flex-wrap: wrap; }
.filter-btn { font-size: 12px; padding: 5px 12px; border: 1.5px solid #e0e0e0; border-radius: 20px; background: #fff; cursor: pointer; color: #666; transition: all 0.15s; font-family: inherit; }
.filter-btn.active { background: #1a1a1a; color: #fff; border-color: #1a1a1a; }

.start-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; margin-bottom: 1.5rem; }
.week-card { border: 1.5px solid #e0e0e0; border-radius: 12px; padding: 1rem; cursor: pointer; transition: all 0.15s; background: #fff; }
.week-card:hover { border-color: #1D9E75; }
.week-card.selected { border-color: #1D9E75; background: #E1F5EE; }
.week-card h3 { font-size: 15px; font-weight: 600; color: #1a1a1a; margin-bottom: 2px; }
.week-card p { font-size: 12px; color: #888; }
.week-card.selected h3 { color: #0F6E56; }
.week-card.selected p { color: #1D9E75; }

.separator { border: none; border-top: 1.5px solid #e0e0e0; margin: 1.5rem 0; }
.result-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; flex-wrap: wrap; gap: 8px; }
.result-top p { font-size: 15px; font-weight: 600; color: #1a1a1a; }
</style>
</head>
<body>
<div id="app">
  <div id="start-screen" class="screen active">
    <div class="header">
      <h1>앱프로그래밍응용 퀴즈</h1>
      <p>셀프 체크 문제 모음 — 풀고 싶은 주차를 선택하세요</p>
    </div>
    <div class="start-grid" id="week-grid"></div>
    <div style="display:flex;gap:8px;margin-bottom:1.25rem;">
      <button class="btn-secondary" onclick="selectAll()">전체 선택</button>
      <button class="btn-secondary" onclick="selectNone()">선택 해제</button>
    </div>
    <button class="btn-primary" onclick="startQuiz()">퀴즈 시작</button>
  </div>

  <div id="quiz-screen" class="screen">
    <div class="progress-bar-wrap"><div class="progress-bar-fill" id="progress-fill"></div></div>
    <div class="q-meta">
      <span class="q-badge week" id="q-week"></span>
      <span class="q-badge type" id="q-type"></span>
      <span class="q-num" id="q-num"></span>
    </div>
    <div class="q-text" id="q-text"></div>
    <div id="q-input-area"></div>
    <div class="btn-row">
      <button class="btn-primary" onclick="submitAnswer()">다음</button>
    </div>
  </div>

  <div id="result-screen" class="screen">
    <div class="score-box">
      <div class="score-num" id="score-display"></div>
      <div class="score-label" id="score-label"></div>
    </div>
    <div class="result-top">
      <p>문제별 결과</p>
      <div class="filter-row">
        <button class="filter-btn active" onclick="filterResults('all',this)">전체</button>
        <button class="filter-btn" onclick="filterResults('wrong',this)">틀린 문제</button>
        <button class="filter-btn" onclick="filterResults('correct',this)">맞은 문제</button>
      </div>
    </div>
    <div id="result-list"></div>
    <hr class="separator">
    <button class="btn-primary" onclick="goStart()">다시 풀기</button>
  </div>
</div>

<script>
const QUESTIONS = [
  {week:'1주차',section:'01-1',type:'객관식',q:'다음 중 AI의 발전 과정을 올바른 순서로 나열한 것은?',options:['뉴럴 네트워크 → 딥러닝 → 트랜스포머 → LLM','딥러닝 → 뉴럴 네트워크 → LLM → 트랜스포머','트랜스포머 → 뉴럴 네트워크 → 딥러닝 → LLM','LLM → 트랜스포머 → 딥러닝 → 뉴럴 네트워크'],answer:[0],explain:'뉴럴 네트워크(1950s~)는 인간의 뇌를 모방한 기초 AI, 딥러닝(2010s~)은 이미지·음성 인식 성능 급상승, 트랜스포머(2017~)는 문장 전체 맥락을 파악하는 언어 이해 혁신, LLM(2020~현재)은 사람과 대화하듯 코드를 작성하는 AI 순서로 발전했습니다.'},
  {week:'1주차',section:'01-1',type:'단답형',q:'바이브 코딩 도구는 여러 AI를 선택할 수 있는 ( ) 도구와 자체 AI를 활용하는 ( ) 도구로 나뉜다.',answer:'모델 선택형 / 전용 모델형',explain:'모델 선택형 도구는 Cursor, Replit 등 여러 AI 모델 중 원하는 것을 선택할 수 있고, 전용 모델형 도구는 Claude Code, Gemini CLI처럼 자체 AI만 사용합니다.'},
  {week:'1주차',section:'01-2',type:'객관식',q:'다음 중 AI 어시스턴트의 발전 과정을 올바른 순서로 나열한 것은?',options:['규칙 기반 → 통계 기반 → 딥러닝 기반 → LLM 기반','통계 기반 → 규칙 기반 → LLM 기반 → 딥러닝 기반','딥러닝 기반 → LLM 기반 → 규칙 기반 → 통계 기반','LLM 기반 → 딥러닝 기반 → 통계 기반 → 규칙 기반'],answer:[0],explain:'AI 어시스턴트는 규칙 기반(if-then 규칙) → 통계 기반(확률적 언어 모델) → 딥러닝 기반(신경망 학습) → LLM 기반(대규모 언어 모델) 순서로 발전했습니다.'},
  {week:'1주차',section:'01-2',type:'객관식',q:'다음 중 CLI 기반 바이브 코딩 도구의 특징으로 옳지 않은 것은?',options:['터미널에서 실행한다','GUI 없이 텍스트로만 소통한다','여러 AI 모델을 자유롭게 선택할 수 있다','프로젝트 파일을 직접 수정할 수 있다'],answer:[2],explain:'Claude Code는 CLI 기반 전용 모델형 도구로, 자체 AI(Claude)만 사용합니다. 여러 AI를 자유롭게 선택할 수 있는 것은 Cursor, Replit 같은 모델 선택형 도구의 특징입니다.'},
  {week:'2주차',section:'02-1',type:'객관식',q:'다음 중 좋은 프롬프트의 조건이 아닌 것을 고르세요.',options:['명확성: 원하는 결과를 구체적으로 전달한다','구체성: 필요한 기능이나 조건을 세부적으로 지시한다','창의성: 결과물이 놀라움을 주도록 요구한다','맥락 제공: 왜 필요한지, 어떤 상황에서 활용되는지 알려준다'],answer:[2],explain:'좋은 프롬프트의 3가지 조건은 명확성, 구체성, 맥락 제공입니다. 창의성은 AI에게 맡기는 것이지 프롬프트의 조건이 아닙니다.'},
  {week:'2주차',section:'02-1',type:'단답형',q:'프롬프트와 PRD는 모두 ( ) 원칙을 기반으로 한다. 이 원칙은 Why, Who, What, When, Where, How 여섯 가지 질문으로 구성된다.',answer:'5W1H',explain:'5W1H는 Why(왜), Who(누구), What(무엇), When(언제), Where(어디서), How(어떻게)의 6가지 질문으로 구성된 체계적 사고의 틀입니다.'},
  {week:'2주차',section:'02-2',type:'객관식',q:'4단계 전략의 올바른 순서는?',options:['디자인 → 기본 틀 → 기능 → 점검','기본 틀 → 디자인 → 기능 → 점검','기본 틀 → 기능 → 디자인 → 점검','기능 → 기본 틀 → 점검 → 디자인'],answer:[2],explain:'4단계 전략은 뼈대(기본 틀) → 기능(실제 데이터) → 디자인(시각적 완성도) → 점검(품질 검증) 순서입니다.'},
  {week:'2주차',section:'02-2',type:'객관식',q:'효과적인 프롬프트 작성법으로 옳지 않은 것은?',options:['5W1H 템플릿을 활용하여 체계적으로 질문한다','모든 기능을 한 번에 요청하여 시간을 절약한다','각 섹션에 ID를 부여하여 개별 수정이 가능하도록 한다','구체적인 디자인 레퍼런스를 제공한다'],answer:[1],explain:'한 번에 모든 기능을 요청하면 복잡한 코드가 생성되어 확인과 수정이 어렵습니다. 4단계 전략처럼 단계별로 나눠 요청하는 것이 올바른 방법입니다.'},
  {week:'3주차',section:'03-1',type:'객관식',q:'클로드 코드를 실행하기 위해 필수적으로 설치해야 하는 두 가지 프로그램을 고르세요.',options:['Python과 Visual Studio Code','Node.js와 Git','Docker와 Kubernetes','Chrome과 Firefox'],answer:[1],explain:'클로드 코드는 npm으로 설치하므로 Node.js가 필요하고, 프로젝트 관리를 위해 Git이 필요합니다.'},
  {week:'3주차',section:'03-1',type:'객관식',q:'윈도우 운영체제에서 터미널을 실행하는 명령어는 무엇일까요?',options:['terminal','explorer','cmd','console'],answer:[2],explain:'Windows에서 명령 프롬프트를 실행하려면 검색창에 cmd를 입력하거나 Windows 키+R 후 cmd를 입력합니다.'},
  {week:'3주차',section:'03-1',type:'객관식',q:'npm install -g @anthropic-ai/claude-code 에서 -g 옵션의 의미는?',options:['Git과 연동하여 설치','그래픽 모드로 설치','시스템 전체에서 사용 가능하도록 설치','게스트 모드로 설치'],answer:[2],explain:'-g는 global의 약자로, 시스템 전체에서 claude 명령어를 사용할 수 있도록 전역 설치합니다.'},
  {week:'3주차',section:'03-2',type:'객관식',q:'클로드 코드를 실행할 작업 폴더로 이동하는 방법이 아닌 것을 고르세요.',options:['탐색기 주소창에 cmd를 입력하여 해당 폴더에서 터미널 실행','터미널을 실행한 뒤 cd 명령어로 원하는 폴더로 이동','클로드 코드가 자동으로 최적 폴더를 선택','원하는 폴더에서 마우스 오른쪽 버튼을 클릭해서 터미널 열기'],answer:[2],explain:'클로드 코드는 자동으로 폴더를 선택하지 않습니다. 항상 사용자가 직접 원하는 프로젝트 폴더에서 실행해야 합니다.'},
  {week:'3주차',section:'03-2',type:'객관식',q:'손글씨 인식 프로그램 학습 과정에서 관찰할 수 있는 지표로 옳은 설명을 고르세요.',options:['accuracy는 낮을수록 성능이 좋다','loss는 높을수록 성능이 좋다','accuracy는 높을수록, loss는 낮을수록 성능이 좋다','두 지표 모두 높을수록 성능이 좋다'],answer:[2],explain:'accuracy(정확도)는 높을수록, loss(손실)는 낮을수록 모델 성능이 좋습니다.'},
  {week:'3주차',section:'03-2',type:'객관식',q:'클로드 코드의 권한 설정 옵션이 아닌 것을 고르세요.',options:['Ask every time (매번 확인)','Yes, for this session only (현재 세션만)','Always allow in this project (프로젝트 내 항상 허용)','Never allow modifications (수정 절대 불가)'],answer:[3],explain:'클로드 코드의 권한 설정 옵션은 3가지(매번 확인, 현재 세션만, 프로젝트 내 항상 허용)입니다. Never allow modifications는 존재하지 않는 옵션입니다.'},
  {week:'3주차',section:'03-3',type:'객관식',q:'CLAUDE.md 파일의 주요 역할이 아닌 것을 고르세요.',options:['프로젝트 맥락을 자동으로 복원','코딩 규칙과 명령어 저장','이전 대화 내용 전체 저장','클로드 코드가 시작할 때 자동으로 읽어들임'],answer:[2],explain:'CLAUDE.md는 프로젝트 구조·규칙·명령어를 담은 설정 파일입니다. 이전 대화 내용 전체 저장은 CLAUDE.md의 역할이 아닙니다.'},
  {week:'3주차',section:'03-3',type:'객관식',q:'CLAUDE.md 파일을 자동으로 생성하는 명령어를 고르세요.',options:['/start','/init','/create','/setup'],answer:[1],explain:'/init 명령어를 실행하면 클로드 코드가 프로젝트 폴더를 자동 분석하고 CLAUDE.md 파일을 생성합니다.'},

  {week:'7주차',section:'07-1',type:'객관식',q:"에이전트 생성 시 'Inherit from parent' 옵션을 선택했을 때의 동작으로 옳은 것을 고르세요.",options:['항상 가장 저렴한 모델을 자동 선택한다','메인 세션에서 사용 중인 모델을 그대로 상속받는다','부모 에이전트가 사용하는 모델을 복사한다','Claude의 최신 모델로 자동 업그레이드된다'],answer:[1],explain:"'Inherit from parent'는 현재 메인 세션에서 사용 중인 AI 모델을 에이전트에 그대로 적용합니다."},

  {week:'7주차',section:'07-2',type:'객관식',q:'AI 공감 다이어리 개발에서 QA 테스트 시간이 더 오래 걸린 이유로 가장 적절한 것을 고르세요.',options:['QA 에이전트가 더 느린 AI 모델을 사용하기 때문이다','QA 에이전트는 이전 에이전트들의 작업 결과를 모두 검토해야 하기 때문이다','QA 에이전트만 인터넷 연결이 필요하기 때문이다','QA 에이전트는 파일 읽기 권한이 없기 때문이다'],answer:[1],explain:'QA 에이전트는 백엔드, 프런트엔드 에이전트가 만든 모든 결과물을 검토·테스트해야 하므로 작업 범위가 넓어 시간이 더 걸립니다.'},
  {week:'7주차',section:'07-2',type:'객관식',q:'PDF 요약 도구에서 PRD를 다른 에이전트들이 참조하는 방식으로 옳지 않은 것을 고르세요.',options:['PRD가 프로젝트 폴더에 생성되어 각 에이전트들이 접근한다','에이전트들이 순차적, 혹은 병렬로 작업하며 PRD를 참조하게 된다','PRD 파일 경로를 에이전트별로 지정하지 않아도 된다',"PRD는 '.claude/agents/' 폴더에 자동으로 복사되어 공유된다"],answer:[3],explain:"PRD는 프로젝트 폴더에 생성되고 각 에이전트가 해당 위치에서 참조합니다. '.claude/agents/'에 자동 복사되는 기능은 없습니다."},

  {week:'8주차',section:'08-1',type:'객관식',q:"로컬 MCP 서버 설치 명령어에서 '--' 구분자의 역할로 옳은 것을 고르세요.",options:['주석을 표시하는 기호','클로드 코드 옵션과 MCP 서버 실행 명령을 구분','버전 정보를 나타내는 표시','에러 처리를 위한 구분자'],answer:[1],explain:"'--' 구분자는 클로드 코드 자체에 전달되는 옵션과 MCP 서버를 실행하는 명령어를 구분합니다."},
  {week:'8주차',section:'08-1',type:'서술형',q:'Sequential Thinking MCP를 사용했을 때와 일반 추론의 차이점을 서술하세요.',answer:'Sequential Thinking MCP는 문제를 단계별로 분해하여 순차적으로 사고하므로 복잡한 문제에서 논리적 오류가 줄고 추론 과정이 명확하게 드러난다. 일반 추론은 한 번에 답을 생성하여 중간 과정이 생략될 수 있다.',explain:'Sequential Thinking은 문제를 여러 단계로 나눠 각 단계를 명시적으로 처리하여 복잡한 문제에서 논리적 오류를 줄이고 추론 과정을 투명하게 확인할 수 있습니다.'},
  {week:'8주차',section:'08-2',type:'객관식',q:'Playwright MCP가 테스트 완료 후 생성하는 폴더 이름을 고르세요.',options:['.test-results','.playwright-mcp','.automation','.screenshots'],answer:[0],explain:'Playwright MCP는 테스트 완료 후 .test-results 폴더를 생성하여 테스트 결과, 스크린샷, 오류 로그 등을 저장합니다.'},
  {week:'8주차',section:'08-2',type:'객관식',q:'깃허브에 코드를 업로드하는 순서로 올바른 것을 고르세요.',options:['commit → add → push','push → add → commit','add → commit → push','add → push → commit'],answer:[2],explain:'Git 업로드 순서: add(스테이징) → commit(로컬 저장소에 기록) → push(원격 저장소에 업로드)'},
  {week:'8주차',section:'08-2',type:'서술형',q:'MCP 서버 주소를 찾는 가장 효과적인 방법 두 가지를 설명하세요.',answer:'① MCP 공식 문서 또는 GitHub 저장소에서 확인\n② 클로드 코드에서 /mcp 명령어로 등록된 서버 목록 확인',explain:'MCP 서버 주소는 각 서버의 공식 GitHub 저장소나 문서에서 확인하는 것이 가장 정확합니다. 이미 등록된 서버는 /mcp 명령어로 확인할 수 있습니다.'},
  {week:'8주차',section:'08-3',type:'객관식',q:'로컬 스토리지와 클라우드 데이터베이스의 가장 큰 차이점은?',options:['로컬 스토리지가 더 빠르다','데이터베이스는 여러 기기에서 데이터를 공유할 수 있다','로컬 스토리지가 더 안전하다','데이터베이스는 무료가 없다'],answer:[1],explain:'클라우드 데이터베이스는 여러 기기에서 데이터를 공유하고 실시간 동기화가 가능합니다. 로컬 스토리지는 해당 기기에서만 접근 가능합니다.'},
  {week:'8주차',section:'08-3',type:'객관식',q:'Vercel 배포 시 404 에러가 발생한 이유와 해결 방법으로 옳은 것을 고르세요.',options:['서버 오류 – 재시작 필요','index.html 파일 부재 – 파일명 변경 필요','인증 실패 – 재로그인 필요','네트워크 오류 – 연결 확인 필요'],answer:[1],explain:'Vercel 배포 시 404 에러는 진입점 파일인 index.html이 없을 때 주로 발생합니다. 메인 HTML 파일 이름을 index.html로 변경하면 해결됩니다.'},
  {week:'8주차',section:'08-3',type:'서술형',q:'Supabase의 테이블과 엑셀 시트의 유사점과 차이점을 설명하세요.',answer:'유사점: 둘 다 행과 열로 데이터를 구성한다. 차이점: 엑셀은 로컬 파일이지만 Supabase는 클라우드 기반으로 여러 사용자가 동시 접근 가능하고 실시간 동기화를 지원한다.',explain:'Supabase 테이블은 엑셀처럼 행(레코드)과 열(필드)로 구성되지만, 클라우드에 저장되어 여러 기기/사용자가 동시 접근하고 실시간 데이터 공유가 가능합니다.'},
];

const WEEKS = ['1주차','2주차','3주차','4주차','5주차','6주차','7주차','8주차'];
let selectedWeeks = new Set(WEEKS);
let quizQuestions = [], current = 0, answers = [], multiSelected = [], tableInputs = [];

function init() {
  const grid = document.getElementById('week-grid');
  grid.innerHTML = '';
  WEEKS.forEach(w => {
    const cnt = QUESTIONS.filter(q => q.week === w).length;
    const card = document.createElement('div');
    card.className = 'week-card selected';
    card.id = 'wcard-' + w;
    card.innerHTML = `<h3>${w}</h3><p>${cnt}문제</p>`;
    card.onclick = () => toggleWeek(w, card);
    grid.appendChild(card);
  });
}

function toggleWeek(w, card) {
  if (selectedWeeks.has(w)) { selectedWeeks.delete(w); card.className = 'week-card'; }
  else { selectedWeeks.add(w); card.className = 'week-card selected'; }
}
function selectAll() { WEEKS.forEach(w => { selectedWeeks.add(w); document.getElementById('wcard-'+w).className = 'week-card selected'; }); }
function selectNone() { WEEKS.forEach(w => { selectedWeeks.delete(w); document.getElementById('wcard-'+w).className = 'week-card'; }); }

function startQuiz() {
  if (selectedWeeks.size === 0) { alert('주차를 하나 이상 선택하세요.'); return; }
  quizQuestions = QUESTIONS.filter(q => selectedWeeks.has(q.week));
  current = 0; answers = [];
  showScreen('quiz-screen');
  renderQuestion();
}

function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  window.scrollTo(0, 0);
}

function renderQuestion() {
  const q = quizQuestions[current];
  const pct = Math.round((current / quizQuestions.length) * 100);
  document.getElementById('progress-fill').style.width = pct + '%';
  document.getElementById('q-week').textContent = q.week + ' ' + q.section;
  document.getElementById('q-type').textContent = q.type;
  document.getElementById('q-num').textContent = (current+1) + ' / ' + quizQuestions.length;
  document.getElementById('q-text').textContent = q.q;
  const area = document.getElementById('q-input-area');
  area.innerHTML = '';
  multiSelected = []; tableInputs = [];

  if (q.type === '객관식') {
    const isMulti = q.answer.length > 1;
    if (isMulti) { const h = document.createElement('div'); h.className = 'multi-hint'; h.textContent = '복수 선택 가능'; area.appendChild(h); }
    const opts = document.createElement('div'); opts.className = 'options';
    q.options.forEach((o, i) => {
      const btn = document.createElement('button'); btn.className = 'option-btn';
      btn.textContent = (i+1) + '. ' + o;
      btn.onclick = () => {
        if (isMulti) {
          if (multiSelected.includes(i)) { multiSelected = multiSelected.filter(x=>x!==i); btn.classList.remove('selected'); }
          else { multiSelected.push(i); btn.classList.add('selected'); }
        } else {
          opts.querySelectorAll('.option-btn').forEach(b=>b.classList.remove('selected'));
          btn.classList.add('selected'); multiSelected = [i];
        }
      };
      opts.appendChild(btn);
    });
    area.appendChild(opts);
  } else if (q.type === '단답형' || q.type === '서술형') {
    const wrap = document.createElement('div'); wrap.className = 'text-input-wrap';
    const ta = document.createElement('textarea'); ta.className = 'text-input';
    ta.placeholder = q.type === '서술형' ? '서술형 답안을 입력하세요...' : '답을 입력하세요...';
    wrap.appendChild(ta); area.appendChild(wrap);
  } else if (q.type === '표 채우기') {
    const wrap = document.createElement('div'); wrap.className = 'table-input-wrap';
    const tbl = document.createElement('table'); tbl.className = 'fill-table';
    const thead = document.createElement('thead'); const hr = document.createElement('tr');
    q.tableHeaders.forEach(h => { const th = document.createElement('th'); th.textContent = h; hr.appendChild(th); });
    thead.appendChild(hr); tbl.appendChild(thead);
    const tbody = document.createElement('tbody');
    q.tableRows.forEach((row, ri) => {
      const tr = document.createElement('tr');
      row.forEach((cell, ci) => {
        const td = document.createElement('td');
        if (ci === q.tableHeaders.length - 1) {
          const inp = document.createElement('input'); inp.type = 'text'; inp.placeholder = '입력...';
          tableInputs[ri] = inp; td.appendChild(inp);
        } else { td.textContent = cell; }
        tr.appendChild(td);
      });
      tbody.appendChild(tr);
    });
    tbl.appendChild(tbody); wrap.appendChild(tbl); area.appendChild(wrap);
  }
}

function submitAnswer() {
  const q = quizQuestions[current];
  let userAnswer;
  if (q.type === '객관식') { userAnswer = [...multiSelected].sort(); }
  else if (q.type === '단답형' || q.type === '서술형') { userAnswer = document.querySelector('.text-input') ? document.querySelector('.text-input').value.trim() : ''; }
  else if (q.type === '표 채우기') { userAnswer = tableInputs.map(inp => inp ? inp.value.trim() : ''); }
  answers.push({ q, userAnswer });
  current++;
  if (current < quizQuestions.length) { renderQuestion(); }
  else { showResults(); }
}

function showResults() {
  showScreen('result-screen');
  const auto = answers.filter(a => a.q.type === '객관식');
  const correct = auto.filter(a => JSON.stringify([...a.userAnswer].sort()) === JSON.stringify([...a.q.answer].sort())).length;
  const manual = answers.filter(a => a.q.type !== '객관식').length;
  document.getElementById('score-display').textContent = correct + ' / ' + auto.length;
  document.getElementById('score-label').textContent = '객관식 자동 채점' + (manual > 0 ? ' · 주관식/서술형 ' + manual + '문제는 직접 확인' : '');
  renderResultList('all');
}

function renderResultList(filter) {
  const list = document.getElementById('result-list'); list.innerHTML = '';
  answers.forEach((a, idx) => {
    const q = a.q;
    let cardClass, icon;
    if (q.type === '객관식') {
      const isCorrect = JSON.stringify([...a.userAnswer].sort()) === JSON.stringify([...q.answer].sort());
      cardClass = isCorrect ? 'correct' : 'wrong'; icon = isCorrect ? '정답' : '오답';
    } else { cardClass = 'manual'; icon = '직접 확인'; }
    if (filter === 'wrong' && cardClass !== 'wrong') return;
    if (filter === 'correct' && cardClass !== 'correct') return;

    const card = document.createElement('div'); card.className = 'result-card ' + cardClass;
    let answerHTML = '';
    if (q.type === '객관식') {
      const userLabels = a.userAnswer.map(i => (i+1)+'. '+q.options[i]).join(', ') || '(선택 없음)';
      const correctLabels = q.answer.map(i => (i+1)+'. '+q.options[i]).join(', ');
      const isC = JSON.stringify([...a.userAnswer].sort()) === JSON.stringify([...q.answer].sort());
      answerHTML = `<div class="result-answer"><span class="correct-ans">정답: ${correctLabels}</span>${!isC ? '<br>내 답: '+userLabels : ''}</div>`;
    } else if (q.type === '표 채우기') {
      const userVals = Array.isArray(a.userAnswer) ? a.userAnswer.join(' / ') : a.userAnswer;
      answerHTML = `<div class="result-answer"><span class="correct-ans">정답: ${q.answer.join(' / ')}</span><br>내 답: ${userVals||'(입력 없음)'}</div>`;
    } else {
      answerHTML = `<div class="result-answer"><span class="correct-ans">정답: ${q.answer}</span><br>내 답: ${a.userAnswer||'(입력 없음)'}</div>`;
    }
    card.innerHTML = `
      <div class="result-header">
        <span class="result-icon">${icon}</span>
        <span class="result-q">Q${idx+1}. ${q.q.substring(0,45)}${q.q.length>45?'...':''}</span>
        <span class="result-week">${q.week} ${q.section}</span>
      </div>
      <div class="result-body">${answerHTML}<div class="result-explain">${q.explain.replace(/\n/g,'<br>')}</div></div>`;
    list.appendChild(card);
  });
}

function filterResults(filter, btn) {
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  renderResultList(filter);
}

function goStart() { showScreen('start-screen'); }
init();
</script>
